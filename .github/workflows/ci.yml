name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    name: CI
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          check-latest: true
      - name: Install unit test dependency
        run: python -m pip install duckdb==2.0.0
      - name: Run unit tests
        run: python -m unittest discover -s tests -v

