name: Python checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Parquet audit dependency
        run: python -m pip install duckdb==2.0.0
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
